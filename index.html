<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Álbum Panini — Mundial 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0f1e; --surface: #111827; --card: #1a2235; --border: #2a3548;
    --text: #f0f4ff; --muted: #7a8aaa; --gold: #f5c842; --gold-dim: #3a2e0a;
    --green: #22c55e; --green-dim: #052a13; --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { max-width: 100%; overflow-x: hidden; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  .topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0.75rem 1rem; display: flex; align-items: center; justify-content: space-between; gap: 8px; position: sticky; top: 0; z-index: 100; width: 100%; }
  .logo { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 2px; color: var(--gold); line-height: 1; flex-shrink: 0; }
  .logo span { color: var(--text); font-size: 12px; letter-spacing: 1px; display: block; margin-top: 1px; }
  .topbar-right { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
  .btn { padding: 7px 12px; border-radius: var(--radius); border: 1px solid var(--border); font-size: 12px; font-family: 'DM Sans', sans-serif; cursor: pointer; background: var(--card); color: var(--text); transition: all 0.15s; white-space: nowrap; flex-shrink: 0; }
  .btn:hover { border-color: var(--gold); color: var(--gold); }
  .btn-share { background: var(--gold); color: #0a0f1e; border-color: var(--gold); font-weight: 500; }
  .btn-share:hover { background: #e0b520; }

  .view-notice { background: #1a1200; border-bottom: 1px solid var(--gold-dim); padding: 10px 1.5rem; font-size: 13px; color: var(--gold); display: none; }
  .view-notice.show { display: block; }

  .container { max-width: 920px; margin: 0 auto; padding: 1.5rem 1rem 4rem; width: 100%; }

  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 1rem; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; text-align: center; }
  .stat-num { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--gold); line-height: 1; }
  .stat-label { font-size: 11px; color: var(--muted); margin-top: 3px; text-transform: uppercase; letter-spacing: 0.5px; }
  .progress-bar { background: var(--border); border-radius: 999px; height: 5px; overflow: hidden; margin-bottom: 1.5rem; }
  .progress-fill { height: 100%; background: var(--gold); border-radius: 999px; transition: width 0.4s; }

  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 1rem; align-items: center; }
  .search-input { flex: 1; min-width: 180px; padding: 8px 13px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 13px; font-family: 'DM Sans', sans-serif; outline: none; }
  .search-input::placeholder { color: var(--muted); }
  .search-input:focus { border-color: var(--gold); }
  .sort-btn { padding: 7px 14px; border-radius: var(--radius); border: 1px solid var(--border); font-size: 12px; cursor: pointer; background: var(--card); color: var(--muted); transition: all 0.15s; font-family: 'DM Sans', sans-serif; }
  .sort-btn.active { background: var(--gold-dim); border-color: var(--gold); color: var(--gold); }

  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 1.5rem; }
  .filter-btn { padding: 5px 13px; border-radius: 999px; border: 1px solid var(--border); font-size: 12px; cursor: pointer; background: var(--card); color: var(--muted); transition: all 0.15s; font-family: 'DM Sans', sans-serif; }
  .filter-btn:hover, .filter-btn.active { background: var(--gold-dim); border-color: var(--gold); color: var(--gold); }

  .section-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 0 10px; border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; }
  .section-header:hover .sec-title { color: var(--gold); }
  .sec-title { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 2px; color: var(--text); transition: color 0.15s; }
  .sec-meta { display: flex; align-items: center; gap: 10px; }
  .sec-count { font-size: 12px; color: var(--muted); }
  .chevron { font-size: 14px; color: var(--muted); transition: transform 0.25s; display: inline-block; }
  .chevron.open { transform: rotate(180deg); }
  .sec-body { overflow: hidden; transition: max-height 0.35s ease, opacity 0.25s; }
  .sec-body.open { max-height: 99999px; opacity: 1; }
  .sec-body.closed { max-height: 0; opacity: 0; pointer-events: none; }

  .special-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 8px; padding: 12px 0 20px; }
  .special-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 11px 13px; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 10px; user-select: none; }
  .special-card:hover { border-color: #3a4a6a; }
  .special-card.owned { background: var(--gold-dim); border-color: var(--gold); }
  .special-card.owned .sc-name { color: var(--gold); }
  .sc-icon { font-size: 20px; flex-shrink: 0; }
  .sc-name { font-size: 12px; color: var(--text); line-height: 1.3; flex: 1; }
  .sc-check { font-size: 13px; color: var(--gold); opacity: 0; flex-shrink: 0; }
  .special-card.owned .sc-check { opacity: 1; }

  .group-label { font-size: 12px; font-weight: 500; color: var(--muted); margin: 1.2rem 0 8px; text-transform: uppercase; letter-spacing: 1px; }
  .teams-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(195px, 1fr)); gap: 8px; }
  .team-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: visible; transition: border-color 0.15s; }
  .team-card:hover { border-color: #3a4a6a; }
  .team-card.complete { border-color: #1a4a2a; }
  .team-header { display: flex; align-items: center; gap: 8px; padding: 10px 12px 8px; }
  .team-flag { width: 28px; height: 20px; flex-shrink: 0; border-radius: 2px; object-fit: cover; }
  .team-name { font-size: 13px; font-weight: 500; flex: 1; line-height: 1.2; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .team-count { font-size: 11px; font-weight: 500; padding: 2px 7px; border-radius: 999px; background: var(--bg); color: var(--muted); flex-shrink: 0; }
  .team-count.full { background: var(--green-dim); color: var(--green); }
  .stickers-row { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 10px 10px; }
  .sticker { width: 28px; height: 28px; border-radius: 5px; border: 1px solid var(--border); background: var(--bg); cursor: pointer; transition: all 0.1s; display: flex; align-items: center; justify-content: center; font-size: 9px; color: var(--muted); user-select: none; position: relative; flex-shrink: 0; }
  .sticker:hover { border-color: var(--gold); }
  .sticker.owned { background: var(--green-dim); border-color: var(--green); color: var(--green); font-size: 11px; font-weight: 500; }
  .sticker.is-special { border-style: dashed; border-color: #4a3a1a; }
  .sticker.is-special.owned { border-style: solid; }
  .sticker .rep-badge { position: absolute; top: -5px; right: -5px; background: var(--gold); color: #0a0f1e; font-size: 8px; font-weight: 700; border-radius: 999px; padding: 0 3px; min-width: 13px; text-align: center; line-height: 13px; display: none; }
  .sticker.repeated .rep-badge { display: block; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--gold); color: #0a0f1e; padding: 10px 20px; border-radius: 999px; font-size: 13px; font-weight: 500; opacity: 0; transition: all 0.3s; z-index: 999; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 600px) {
    .container { padding: 1rem 0.75rem 4rem; }
    .stats-grid { grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .stat-card { padding: 8px 4px; }
    .stat-num { font-size: 22px; }
    .stat-label { font-size: 9px; }
    .teams-grid { grid-template-columns: 1fr; }
    .special-grid { grid-template-columns: 1fr 1fr; }
    .filters { gap: 4px; }
    .filter-btn { padding: 4px 8px; font-size: 11px; }
    .stickers-row { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; padding: 0 8px 10px; }
    .sticker { width: 100%; height: auto; aspect-ratio: 1; flex-shrink: unset; font-size: 8px; }
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">Panini <span>Mundial 2026™</span></div>
  <div class="topbar-right">
    <button class="btn" onclick="resetAll()" id="btn-reset">Borrar todo</button>
    <button class="btn btn-share" onclick="shareProg()" id="btn-share">⬆ Compartir álbum</button>
  </div>
</div>
<div class="view-notice" id="view-notice">
  📥 Abriste el álbum de alguien — podés editar y luego mandarle tu link con <strong>⬆ Compartir álbum</strong>. Tus cambios no afectan el álbum original.
</div>

<div class="container">
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-num" id="s-owned">0</div><div class="stat-label">Tengo</div></div>
    <div class="stat-card"><div class="stat-num" id="s-missing">980</div><div class="stat-label">Me faltan</div></div>
    <div class="stat-card"><div class="stat-num" id="s-pct">0%</div><div class="stat-label">Completado</div></div>
    <div class="stat-card"><div class="stat-num" id="s-teams">0/48</div><div class="stat-label">Selecciones</div></div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="prog" style="width:0%"></div></div>
  <div class="controls">
    <input type="text" class="search-input" id="search" placeholder="🔍 Buscar selección..." oninput="buildTeams()">
    <button class="sort-btn active" id="sort-grupo" onclick="setSort('grupo')">Por grupo</button>
    <button class="sort-btn" id="sort-alfa" onclick="setSort('alfa')">A–Z</button>
  </div>
  <div class="filters" id="filters"></div>
  <div id="album"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'panini-2026-v3';
const TOTAL = 980;

const specials = [
  { id:'s-logo-panini', icon:'🎴', name:'Logo Panini' },
  { id:'s-copa1',       icon:'🏆', name:'Copa del Mundo 1' },
  { id:'s-copa2',       icon:'🏆', name:'Copa del Mundo 2' },
  { id:'s-mascotas',    icon:'🦅', name:'Mascotas' },
  { id:'s-weare',       icon:'⭐', name:'Logo We Are 26' },
  { id:'s-pelota',      icon:'⚽', name:'Pelota oficial' },
  { id:'s-copa-can',    icon:'🇨🇦', name:'Copa sede Canadá' },
  { id:'s-copa-mex',    icon:'🇲🇽', name:'Copa sede México' },
  { id:'s-copa-usa',    icon:'🇺🇸', name:'Copa sede EE.UU.' },
  { id:'s-camp1',  icon:'🥇', name:'Campeón 1' },
  { id:'s-camp2',  icon:'🥇', name:'Campeón 2' },
  { id:'s-camp3',  icon:'🥇', name:'Campeón 3' },
  { id:'s-camp4',  icon:'🥇', name:'Campeón 4' },
  { id:'s-camp5',  icon:'🥇', name:'Campeón 5' },
  { id:'s-camp6',  icon:'🥇', name:'Campeón 6' },
  { id:'s-camp7',  icon:'🥇', name:'Campeón 7' },
  { id:'s-camp8',  icon:'🥇', name:'Campeón 8' },
  { id:'s-camp9',  icon:'🥇', name:'Campeón 9' },
  { id:'s-camp10', icon:'🥇', name:'Campeón 10' },
  { id:'s-camp11', icon:'🥇', name:'Campeón 11' },
];

const groups = {
  A: [{ name:'México',         iso:'mx' }, { name:'Sudáfrica',       iso:'za' }, { name:'Corea del Sur',  iso:'kr' }, { name:'Chequia',         iso:'cz' }],
  B: [{ name:'Canadá',         iso:'ca' }, { name:'Qatar',           iso:'qa' }, { name:'Suiza',          iso:'ch' }, { name:'Eslovenia',       iso:'si' }],
  C: [{ name:'Brasil',         iso:'br' }, { name:'Marruecos',       iso:'ma' }, { name:'Haití',          iso:'ht' }, { name:'Escocia',         iso:'gb-sct' }],
  D: [{ name:'EE.UU.',         iso:'us' }, { name:'Paraguay',        iso:'py' }, { name:'Australia',      iso:'au' }, { name:'Polonia',         iso:'pl' }],
  E: [{ name:'Alemania',       iso:'de' }, { name:'Curazao',         iso:'cw' }, { name:'Costa de Marfil',iso:'ci' }, { name:'Ecuador',         iso:'ec' }],
  F: [{ name:'Países Bajos',   iso:'nl' }, { name:'Japón',           iso:'jp' }, { name:'Túnez',          iso:'tn' }, { name:'Turquía',         iso:'tr' }],
  G: [{ name:'Bélgica',        iso:'be' }, { name:'Egipto',          iso:'eg' }, { name:'Irán',           iso:'ir' }, { name:'Nueva Zelanda',   iso:'nz' }],
  H: [{ name:'España',         iso:'es' }, { name:'Cabo Verde',      iso:'cv' }, { name:'Arabia Saudita', iso:'sa' }, { name:'Uruguay',         iso:'uy' }],
  I: [{ name:'Francia',        iso:'fr' }, { name:'Senegal',         iso:'sn' }, { name:'Irak',           iso:'iq' }, { name:'Noruega',         iso:'no' }],
  J: [{ name:'Argentina',      iso:'ar' }, { name:'Argelia',         iso:'dz' }, { name:'Austria',        iso:'at' }, { name:'Jordania',        iso:'jo' }],
  K: [{ name:'Portugal',       iso:'pt' }, { name:'Uzbekistán',      iso:'uz' }, { name:'Colombia',       iso:'co' }, { name:'R.D. del Congo',  iso:'cd' }],
  L: [{ name:'Inglaterra',     iso:'gb-eng' }, { name:'Croacia',     iso:'hr' }, { name:'Ghana',          iso:'gh' }, { name:'Panamá',          iso:'pa' }],
};

const stickerLabels = Array.from({length:20}, (_,i) => i === 0 ? 'Escudo' : String(i+1));

let owned = {}, sortMode = 'grupo', activeGroup = 'all';

function loadData() {
  const hash = window.location.hash.slice(1);
  if (hash.startsWith('share=')) {
    // Load shared data as starting point, save to local storage so edits persist
    try { owned = JSON.parse(atob(decodeURIComponent(hash.slice(6)))); } catch(e) { owned = {}; }
    // Save immediately so refreshing keeps the state
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(owned)); } catch(e) {}
    // Clear hash from URL so subsequent saves don't re-load shared data
    history.replaceState(null, '', window.location.pathname);
    document.getElementById('view-notice').classList.add('show');
  } else {
    try { const r = localStorage.getItem(STORAGE_KEY); if (r) owned = JSON.parse(r); } catch(e) { owned = {}; }
  }
}

function saveData() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(owned)); } catch(e) {}
}

function shareProg() {
  try {
    const encoded = encodeURIComponent(btoa(JSON.stringify(owned)));
    const url = window.location.href.split('#')[0] + '#share=' + encoded;
    navigator.clipboard.writeText(url).then(() => showToast('✓ Link copiado — mandáselo a quien quieras'));
  } catch(e) { showToast('Error al generar el link'); }
}

function resetAll() {
  if (!confirm('¿Borrar todo el progreso?')) return;
  owned = {}; localStorage.removeItem(STORAGE_KEY);
  buildAll(); updateStats();
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

function countTeam(g, idx) {
  let c = 0;
  for (let s = 0; s < 20; s++) if ((owned[`${g}-${idx}-${s}`] || 0) >= 1) c++;
  return c;
}

function updateStats() {
  const total = Object.values(owned).filter(v => v >= 1).length;
  const pct = Math.round((total / TOTAL) * 100);
  document.getElementById('s-owned').textContent = total;
  document.getElementById('s-missing').textContent = TOTAL - total;
  document.getElementById('s-pct').textContent = pct + '%';
  document.getElementById('prog').style.width = pct + '%';
  let ct = 0;
  Object.entries(groups).forEach(([g, teams]) => teams.forEach((_, i) => { if (countTeam(g, i) === 20) ct++; }));
  document.getElementById('s-teams').textContent = ct + '/48';
}

function setSort(mode) {
  sortMode = mode;
  document.getElementById('sort-grupo').classList.toggle('active', mode === 'grupo');
  document.getElementById('sort-alfa').classList.toggle('active', mode === 'alfa');
  buildTeams();
}

function makeCollapsible(titleText, countId, bodyId, startOpen) {
  const wrapper = document.createElement('div');
  wrapper.style.marginBottom = '8px';

  const header = document.createElement('div');
  header.className = 'section-header';

  const title = document.createElement('span');
  title.className = 'sec-title';
  title.textContent = titleText;

  const meta = document.createElement('div');
  meta.className = 'sec-meta';
  const countEl = document.createElement('span');
  countEl.className = 'sec-count';
  countEl.id = countId;
  const chev = document.createElement('span');
  chev.className = 'chevron' + (startOpen ? ' open' : '');
  chev.textContent = '▼';

  meta.appendChild(countEl);
  meta.appendChild(chev);
  header.appendChild(title);
  header.appendChild(meta);

  const body = document.createElement('div');
  body.className = 'sec-body ' + (startOpen ? 'open' : 'closed');
  body.id = bodyId;

  let isOpen = startOpen;
  header.onclick = () => {
    isOpen = !isOpen;
    body.classList.toggle('open', isOpen);
    body.classList.toggle('closed', !isOpen);
    chev.classList.toggle('open', isOpen);
  };

  wrapper.appendChild(header);
  wrapper.appendChild(body);
  return { wrapper, body, countEl };
}

function buildSpecials() {
  const { wrapper, body, countEl } = makeCollapsible('Figuritas especiales', 'spec-count', 'spec-body', true);

  const updateCount = () => {
    countEl.textContent = `${specials.filter(s => owned[s.id] >= 1).length}/${specials.length}`;
  };
  updateCount();

  const grid = document.createElement('div');
  grid.className = 'special-grid';

  specials.forEach(sp => {
    const card = document.createElement('div');
    card.className = 'special-card' + ((owned[sp.id] || 0) >= 1 ? ' owned' : '');
    card.innerHTML = `<span class="sc-icon">${sp.icon}</span><span class="sc-name">${sp.name}</span><span class="sc-check">✓</span>`;

      card.onclick = () => {
        owned[sp.id] = (owned[sp.id] || 0) >= 1 ? 0 : 1;
        card.classList.toggle('owned', owned[sp.id] >= 1);
        saveData(); updateStats(); updateCount();
      };
    grid.appendChild(card);
  });

  body.appendChild(grid);
  document.getElementById('album').appendChild(wrapper);
}

function buildTeams() {
  const existing = document.getElementById('teams-wrap');
  if (existing) existing.remove();

  const { wrapper, body, countEl } = makeCollapsible('Selecciones', 'teams-count', 'teams-body', true);
  wrapper.id = 'teams-wrap';
  countEl.textContent = '48 equipos · 20 figuritas c/u';

  const q = document.getElementById('search').value.toLowerCase();

  const appendTeamGrid = (teams) => {
    const grid = document.createElement('div');
    grid.className = 'teams-grid';
    teams.forEach(t => grid.appendChild(buildTeamCard(t.g, t.idx, t.name, t.iso)));
    body.appendChild(grid);
  };

  if (sortMode === 'alfa') {
    let all = [];
    Object.entries(groups).forEach(([g, teams]) => teams.forEach((t, idx) => all.push({ g, idx, ...t })));
    all.sort((a, b) => a.name.localeCompare(b.name, 'es'));
    if (activeGroup !== 'all') all = all.filter(t => t.g === activeGroup);
    if (q) all = all.filter(t => t.name.toLowerCase().includes(q));
    body.style.paddingTop = '12px';
    appendTeamGrid(all);
  } else {
    Object.entries(groups).forEach(([g, teams]) => {
      if (activeGroup !== 'all' && g !== activeGroup) return;
      const filtered = teams.map((t, idx) => ({ ...t, idx, g })).filter(t => !q || t.name.toLowerCase().includes(q));
      if (!filtered.length) return;
      const lbl = document.createElement('div');
      lbl.className = 'group-label';
      lbl.textContent = `Grupo ${g}`;
      body.appendChild(lbl);
      appendTeamGrid(filtered);
    });
  }

  document.getElementById('album').appendChild(wrapper);
}

function buildTeamCard(g, idx, name, flag) {
  const c = countTeam(g, idx);
  const card = document.createElement('div');
  card.className = 'team-card' + (c === 20 ? ' complete' : '');
  const th = document.createElement('div');
  th.className = 'team-header';
  th.innerHTML = `<img class="team-flag" src="https://flagcdn.com/w40/${flag}.png" alt="${name}"><span class="team-name">${name}</span><span class="team-count${c===20?' full':''}" id="cnt-${g}-${idx}">${c}/20</span>`;
  card.appendChild(th);
  const row = document.createElement('div');
  row.className = 'stickers-row';
  for (let s = 0; s < 20; s++) {
    const key = `${g}-${idx}-${s}`;
    const el = document.createElement('div');
    const label = s === 0 ? '🛡' : String(s + 1);
    const cnt = owned[key] || 0;
    el.className = 'sticker' + (s === 0 ? ' is-special' : '') + (cnt >= 1 ? ' owned' : '') + (cnt >= 2 ? ' repeated' : '');
    el.title = stickerLabels[s];
    el.innerHTML = `${label}<span class="rep-badge">${cnt >= 2 ? '+' + (cnt - 1) : ''}</span>`;

      const updateEl = () => {
        const newCnt = owned[key] || 0;
        el.className = 'sticker' + (s === 0 ? ' is-special' : '') + (newCnt >= 1 ? ' owned' : '') + (newCnt >= 2 ? ' repeated' : '');
        el.innerHTML = `${label}<span class="rep-badge">${newCnt >= 2 ? '+' + (newCnt - 1) : ''}</span>`;
        saveData(); updateStats();
        const nc = countTeam(g, idx);
        const ce = document.getElementById(`cnt-${g}-${idx}`);
        if (ce) { ce.textContent = nc+'/20'; ce.className = 'team-count'+(nc===20?' full':''); }
        card.className = 'team-card'+(nc===20?' complete':'');
      };
      el.onclick = () => {
        owned[key] = (owned[key] || 0) >= 6 ? 0 : (owned[key] || 0) + 1;
        updateEl();
      };
      el.oncontextmenu = (e) => {
        e.preventDefault();
        owned[key] = (owned[key] || 0) <= 0 ? 0 : (owned[key] || 0) - 1;
        updateEl();
      };
    row.appendChild(el);
  }
  card.appendChild(row);
  return card;
}

function buildFilters() {
  const wrap = document.getElementById('filters');
  const mk = (label, val) => {
    const b = document.createElement('button');
    b.className = 'filter-btn' + (val === 'all' ? ' active' : '');
    b.textContent = label; b.id = 'fb-' + val;
    b.onclick = () => {
      activeGroup = val;
      document.querySelectorAll('.filter-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      buildTeams();
    };
    wrap.appendChild(b);
  };
  mk('Todos', 'all');
  Object.keys(groups).forEach(g => mk('Grupo ' + g, g));
}

function buildAll() {
  document.getElementById('album').innerHTML = '';
  buildSpecials();
  buildTeams();
}

loadData();
buildFilters();
buildAll();
updateStats();
</script>
