<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Álbum Panini — Mundial 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0f1e;
    --surface: #111827;
    --card: #1a2235;
    --border: #2a3548;
    --text: #f0f4ff;
    --muted: #7a8aaa;
    --gold: #f5c842;
    --gold-dim: #3a2e0a;
    --green: #22c55e;
    --green-dim: #052a13;
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 1rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 2px;
    color: var(--gold);
    line-height: 1;
  }

  .logo span { color: var(--text); font-size: 14px; letter-spacing: 1px; display: block; margin-top: 1px; }

  .topbar-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .btn {
    padding: 7px 16px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    background: var(--card);
    color: var(--text);
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--gold); color: var(--gold); }
  .btn-share {
    background: var(--gold);
    color: #0a0f1e;
    border-color: var(--gold);
    font-weight: 500;
  }
  .btn-share:hover { background: #e0b520; color: #0a0f1e; border-color: #e0b520; }

  .view-notice {
    background: #1a1200;
    border-bottom: 1px solid var(--gold-dim);
    padding: 10px 1.5rem;
    font-size: 13px;
    color: var(--gold);
    display: none;
    align-items: center;
    gap: 8px;
  }
  .view-notice.show { display: flex; }

  .container { max-width: 900px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }

  .progress-section { margin-bottom: 2rem; }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 8px;
    margin-bottom: 1rem;
  }

  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    text-align: center;
  }
  .stat-num { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--gold); line-height: 1; }
  .stat-label { font-size: 11px; color: var(--muted); margin-top: 3px; text-transform: uppercase; letter-spacing: 0.5px; }

  .progress-bar { background: var(--border); border-radius: 999px; height: 6px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--gold); border-radius: 999px; transition: width 0.4s; }

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 1.5rem;
  }

  .filter-btn {
    padding: 5px 13px;
    border-radius: 999px;
    border: 1px solid var(--border);
    font-size: 12px;
    cursor: pointer;
    background: var(--card);
    color: var(--muted);
    transition: all 0.15s;
    font-family: 'DM Sans', sans-serif;
  }
  .filter-btn:hover, .filter-btn.active {
    background: var(--gold-dim);
    border-color: var(--gold);
    color: var(--gold);
  }

  .search-wrap { margin-bottom: 1rem; }
  .search-wrap input {
    width: 100%;
    padding: 9px 14px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    outline: none;
    transition: border-color 0.15s;
  }
  .search-wrap input::placeholder { color: var(--muted); }
  .search-wrap input:focus { border-color: var(--gold); }

  .group-section { margin-bottom: 2.5rem; }

  .group-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  .group-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    color: var(--gold);
    letter-spacing: 2px;
  }

  .group-progress { font-size: 12px; color: var(--muted); margin-left: auto; }

  .teams-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 8px;
  }

  .team-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color 0.15s;
  }
  .team-card:hover { border-color: #3a4a6a; }
  .team-card.complete { border-color: #1a4a2a; }

  .team-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px 8px;
    cursor: pointer;
    user-select: none;
  }

  .team-flag { font-size: 20px; flex-shrink: 0; }
  .team-name { font-size: 13px; font-weight: 500; flex: 1; line-height: 1.2; }

  .team-count {
    font-size: 11px;
    font-weight: 500;
    padding: 2px 7px;
    border-radius: 999px;
    background: var(--bg);
    color: var(--muted);
    flex-shrink: 0;
  }

  .team-count.full { background: var(--green-dim); color: var(--green); }

  .stickers-row {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding: 0 10px 10px;
  }

  .sticker {
    width: 28px;
    height: 28px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--bg);
    cursor: pointer;
    transition: all 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    color: var(--muted);
    user-select: none;
  }

  .sticker:hover { border-color: var(--gold); }
  .sticker.owned { background: var(--gold); border-color: var(--gold); color: #0a0f1e; font-size: 11px; font-weight: 500; }
  .sticker.special { border-color: #4a3a1a; }
  .sticker.special.owned { background: linear-gradient(135deg, var(--gold), #ff9f1a); }

  .sticker-labels {
    display: flex;
    gap: 4px;
    padding: 0 10px 8px;
    flex-wrap: wrap;
  }
  .sticker-type {
    font-size: 10px;
    color: var(--muted);
    background: var(--bg);
    padding: 1px 6px;
    border-radius: 4px;
    border: 1px solid var(--border);
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--gold);
    color: #0a0f1e;
    padding: 10px 20px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    transition: all 0.3s;
    z-index: 999;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .readonly-badge {
    font-size: 11px;
    background: #1a1a3a;
    color: #8888cc;
    border: 1px solid #2a2a5a;
    padding: 3px 10px;
    border-radius: 999px;
  }

  @media (max-width: 480px) {
    .teams-grid { grid-template-columns: 1fr 1fr; }
    .topbar { padding: 0.75rem 1rem; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    Panini <span>Mundial 2026™</span>
  </div>
  <div class="topbar-right">
    <span class="readonly-badge" id="readonly-badge" style="display:none">👁 Modo vista</span>
    <button class="btn" onclick="resetAll()" id="btn-reset">Borrar todo</button>
    <button class="btn btn-share" onclick="shareProg()" id="btn-share">⬆ Compartir mi álbum</button>
  </div>
</div>

<div class="view-notice" id="view-notice">
  👁 Estás viendo el álbum de otra persona. <strong style="margin-left:4px">Solo podés mirar, no editar.</strong>
</div>

<div class="container">

  <div class="progress-section">
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-num" id="stat-owned">0</div><div class="stat-label">Tengo</div></div>
      <div class="stat-card"><div class="stat-num" id="stat-missing">980</div><div class="stat-label">Me faltan</div></div>
      <div class="stat-card"><div class="stat-num" id="stat-pct">0%</div><div class="stat-label">Completado</div></div>
      <div class="stat-card"><div class="stat-num" id="stat-teams">0</div><div class="stat-label">Selecciones completas</div></div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="prog" style="width:0%"></div></div>
  </div>

  <div class="search-wrap">
    <input type="text" id="search" placeholder="Buscar selección..." oninput="filterTeams()">
  </div>

  <div class="filters" id="filters"></div>

  <div id="album"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'panini-2026-v1';
const TOTAL = 980;

const groups = {
  A: { teams: ['México','Sudáfrica','Corea del Sur','Rep. UEFA D*'], flags: ['🇲🇽','🇿🇦','🇰🇷','🏳️'] },
  B: { teams: ['Canadá','Qatar','Suiza','Rep. UEFA 1*'], flags: ['🇨🇦','🇶🇦','🇨🇭','🏳️'] },
  C: { teams: ['Brasil','Marruecos','Haití','Escocia'], flags: ['🇧🇷','🇲🇦','🇭🇹','🏴󠁧󠁢󠁳󠁣󠁴󠁿'] },
  D: { teams: ['EE.UU.','Paraguay','Australia','Rep. UEFA 3*'], flags: ['🇺🇸','🇵🇾','🇦🇺','🏳️'] },
  E: { teams: ['Alemania','Curazao','Costa de Marfil','Ecuador'], flags: ['🇩🇪','🇨🇼','🇨🇮','🇪🇨'] },
  F: { teams: ['Países Bajos','Japón','Túnez','Rep. UEFA 2*'], flags: ['🇳🇱','🇯🇵','🇹🇳','🏳️'] },
  G: { teams: ['Bélgica','Egipto','Irán','Nueva Zelanda'], flags: ['🇧🇪','🇪🇬','🇮🇷','🇳🇿'] },
  H: { teams: ['España','Cabo Verde','Arabia Saudita','Uruguay'], flags: ['🇪🇸','🇨🇻','🇸🇦','🇺🇾'] },
  I: { teams: ['Francia','Senegal','Rep. Intercon. 2*','Noruega'], flags: ['🇫🇷','🇸🇳','🏳️','🇳🇴'] },
  J: { teams: ['Argentina','Argelia','Austria','Jordania'], flags: ['🇦🇷','🇩🇿','🇦🇹','🇯🇴'] },
  K: { teams: ['Portugal','Uzbekistán','Colombia','Rep. Intercon. 1*'], flags: ['🇵🇹','🇺🇿','🇨🇴','🏳️'] },
  L: { teams: ['Inglaterra','Croacia','Ghana','Panamá'], flags: ['🏴󠁧󠁢󠁥󠁮󠁧󠁿','🇭🇷','🇬🇭','🇵🇦'] },
};

// Each team: escudo(1) + foto grupal(1) + jugadores(18) = 20 stickers
const STICKERS_PER_TEAM = 20;
// Extras: special stickers for stadiums, history, mascot, trophy, Coca-Cola, etc.
// Distribute remaining stickers (980 - 48*20 = 20) as special section
// We model each team as 20 stickers: [escudo, foto, j1..j18]

function teamKey(group, idx) { return `${group}-${idx}`; }
function stickerKey(group, idx, s) { return `${group}-${idx}-${s}`; }

let owned = {};
let readOnly = false;
let activeFilter = 'all';

function loadData() {
  const hash = window.location.hash.slice(1);
  if (hash.startsWith('share=')) {
    readOnly = true;
    try {
      const decoded = atob(hash.slice(6));
      owned = JSON.parse(decoded);
    } catch(e) { owned = {}; }
    document.getElementById('view-notice').classList.add('show');
    document.getElementById('readonly-badge').style.display = 'inline';
    document.getElementById('btn-share').style.display = 'none';
    document.getElementById('btn-reset').style.display = 'none';
  } else {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) owned = JSON.parse(raw);
    } catch(e) { owned = {}; }
  }
}

function saveData() {
  if (readOnly) return;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(owned)); } catch(e) {}
}

function shareProg() {
  try {
    const encoded = btoa(JSON.stringify(owned));
    const url = window.location.href.split('#')[0] + '#share=' + encoded;
    navigator.clipboard.writeText(url).then(() => showToast('✓ Link copiado al portapapeles'));
  } catch(e) {
    showToast('Error al generar el link');
  }
}

function resetAll() {
  if (readOnly) return;
  if (!confirm('¿Borrar todo el progreso?')) return;
  owned = {};
  localStorage.removeItem(STORAGE_KEY);
  document.querySelectorAll('.sticker').forEach(el => el.classList.remove('owned'));
  updateStats();
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

function countOwned(group, idx) {
  let c = 0;
  for (let s = 0; s < STICKERS_PER_TEAM; s++) {
    if (owned[stickerKey(group, idx, s)]) c++;
  }
  return c;
}

function updateStats() {
  const total = Object.values(owned).filter(Boolean).length;
  const pct = Math.round((total / TOTAL) * 100);
  document.getElementById('stat-owned').textContent = total;
  document.getElementById('stat-missing').textContent = TOTAL - total;
  document.getElementById('stat-pct').textContent = pct + '%';
  document.getElementById('prog').style.width = pct + '%';

  let completedTeams = 0;
  Object.entries(groups).forEach(([g, gdata]) => {
    gdata.teams.forEach((_, idx) => {
      if (countOwned(g, idx) === STICKERS_PER_TEAM) completedTeams++;
    });
  });
  document.getElementById('stat-teams').textContent = completedTeams;

  // Update team counts
  Object.entries(groups).forEach(([g, gdata]) => {
    gdata.teams.forEach((_, idx) => {
      const c = countOwned(g, idx);
      const countEl = document.getElementById(`count-${g}-${idx}`);
      const cardEl = document.getElementById(`card-${g}-${idx}`);
      if (countEl) {
        countEl.textContent = `${c}/20`;
        countEl.className = 'team-count' + (c === STICKERS_PER_TEAM ? ' full' : '');
      }
      if (cardEl) cardEl.className = 'team-card' + (c === STICKERS_PER_TEAM ? ' complete' : '');
    });
  });
}

function buildFilters() {
  const wrap = document.getElementById('filters');
  const all = document.createElement('button');
  all.className = 'filter-btn active';
  all.textContent = 'Todos los grupos';
  all.onclick = () => { activeFilter = 'all'; updateFilters(); filterTeams(); };
  wrap.appendChild(all);

  Object.keys(groups).forEach(g => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.textContent = `Grupo ${g}`;
    btn.id = `filter-${g}`;
    btn.onclick = () => { activeFilter = g; updateFilters(); filterTeams(); };
    wrap.appendChild(btn);
  });
}

function updateFilters() {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  if (activeFilter === 'all') {
    document.querySelector('.filter-btn').classList.add('active');
  } else {
    const el = document.getElementById(`filter-${activeFilter}`);
    if (el) el.classList.add('active');
  }
}

function filterTeams() {
  const q = document.getElementById('search').value.toLowerCase();
  document.querySelectorAll('.group-section').forEach(sec => {
    const g = sec.dataset.group;
    if (activeFilter !== 'all' && g !== activeFilter) { sec.style.display = 'none'; return; }
    let anyVisible = false;
    sec.querySelectorAll('.team-card').forEach(card => {
      const name = card.dataset.name.toLowerCase();
      const show = name.includes(q);
      card.style.display = show ? '' : 'none';
      if (show) anyVisible = true;
    });
    sec.style.display = anyVisible ? '' : 'none';
  });
}

const stickerLabels = ['Escudo', 'Foto grupal', ...Array.from({length:18}, (_,i) => `J${i+1}`)];

function buildAlbum() {
  const wrap = document.getElementById('album');
  wrap.innerHTML = '';

  Object.entries(groups).forEach(([g, gdata]) => {
    const sec = document.createElement('div');
    sec.className = 'group-section';
    sec.dataset.group = g;

    const header = document.createElement('div');
    header.className = 'group-header';
    header.innerHTML = `<span class="group-label">Grupo ${g}</span>`;
    sec.appendChild(header);

    const grid = document.createElement('div');
    grid.className = 'teams-grid';

    gdata.teams.forEach((team, idx) => {
      const c = countOwned(g, idx);
      const card = document.createElement('div');
      card.className = 'team-card' + (c === STICKERS_PER_TEAM ? ' complete' : '');
      card.id = `card-${g}-${idx}`;
      card.dataset.name = team;

      const th = document.createElement('div');
      th.className = 'team-header';
      th.innerHTML = `
        <span class="team-flag">${gdata.flags[idx]}</span>
        <span class="team-name">${team}</span>
        <span class="team-count${c === STICKERS_PER_TEAM ? ' full' : ''}" id="count-${g}-${idx}">${c}/20</span>
      `;

      if (!readOnly) {
        // Quick-complete all on double click header
        th.title = 'Click en cada figurita para marcarla';
      }

      const stickersWrap = document.createElement('div');
      stickersWrap.className = 'stickers-row';

      for (let s = 0; s < STICKERS_PER_TEAM; s++) {
        const key = stickerKey(g, idx, s);
        const el = document.createElement('div');
        el.className = 'sticker' + (owned[key] ? ' owned' : '') + (s < 2 ? ' special' : '');
        el.title = stickerLabels[s];
        el.textContent = owned[key] ? '✓' : (s === 0 ? '🛡' : s === 1 ? '📸' : s + '');
        if (!readOnly) {
          el.onclick = () => {
            owned[key] = !owned[key];
            el.classList.toggle('owned', owned[key]);
            el.textContent = owned[key] ? '✓' : (s === 0 ? '🛡' : s === 1 ? '📸' : s + '');
            saveData();
            updateStats();
          };
        }
        stickersWrap.appendChild(el);
      }

      card.appendChild(th);
      card.appendChild(stickersWrap);
      grid.appendChild(card);
    });

    sec.appendChild(grid);
    wrap.appendChild(sec);
  });
}

loadData();
buildFilters();
buildAlbum();
updateStats();
</script>
</body>
</html>
